[project]
name = "vaioic-github-io"
version = "0.1.0"
description = "VAI Optical Imaging Core site"
readme = "README.md"
authors = [
    { name = "Jian Wei Tay", email = "jian.tay@vai.org" }
]
requires-python = ">=3.14"
dependencies = [
    "myst-nb>=1.4.0",
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.23.0",
    "sphinx<9.0",
    "sphinx-design>=0.7.0",
    "sphinx-inline-tabs>=2025.12.21.14",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "sphinx-autobuild>=2025.8.25",
]

[tool.uv]
package = false
